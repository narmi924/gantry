[project]
name = "gantry-backend"
version = "0.1.0"
description = "Match simulator, stats and AI broadcast crew for Gantry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "openai>=3.35.1",
    "azure-identity>=1.26.0",
    "azure-cognitiveservices-speech>=1.52.0",
    "python-dotenv>=1.2.4",
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry>=1.15.0",
]

[tool.uv]
package = false
