<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Gantry architecture: one synthetic match, one AI production crew, four broadcasts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#51606c"/>
    </marker>
  </defs>
  <rect width="1240" height="620" fill="#f5f6f2"/>

  <text x="40" y="52" font-size="26" font-weight="800" fill="#0b2236">Gantry</text>
  <text x="152" y="52" font-size="17" fill="#51606c">One match. One AI production crew. A different broadcast for every fan.</text>

  <!-- data -->
  <g>
    <rect x="40" y="96" width="220" height="200" rx="10" fill="#ffffff" stroke="#c6cdc3"/>
    <text x="58" y="126" font-size="16" font-weight="700" fill="#0b2236">Synthetic match</text>
    <text x="58" y="152" font-size="13" fill="#2b3d4c">Match engine (Python, NumPy)</text>
    <text x="58" y="172" font-size="13" fill="#2b3d4c">22 players + ball, 10 frames/s</text>
    <text x="58" y="192" font-size="13" fill="#2b3d4c">passes, presses, tackles, shots,</text>
    <text x="58" y="210" font-size="13" fill="#2b3d4c">set pieces, substitutions</text>
    <text x="58" y="236" font-size="13" fill="#2b3d4c">Story director shapes tactics;</text>
    <text x="58" y="254" font-size="13" fill="#2b3d4c">every kick is still simulated</text>
    <text x="58" y="280" font-size="12" fill="#51606c">fictional clubs and players</text>

    <rect x="40" y="318" width="220" height="150" rx="10" fill="#ffffff" stroke="#c6cdc3"/>
    <text x="58" y="348" font-size="16" font-weight="700" fill="#0b2236">Stats (code)</text>
    <text x="58" y="374" font-size="13" fill="#2b3d4c">speed, sprints, distance</text>
    <text x="58" y="394" font-size="13" fill="#2b3d4c">pass difficulty, xG, shot speed</text>
    <text x="58" y="414" font-size="13" fill="#2b3d4c">PPDA, field tilt, momentum</text>
    <text x="58" y="434" font-size="13" fill="#2b3d4c">space control, moments</text>
    <text x="58" y="456" font-size="12" fill="#51606c">every number on air comes from here</text>
  </g>

  <!-- crew -->
  <rect x="300" y="96" width="560" height="372" rx="12" fill="#0b2236"/>
  <text x="322" y="128" font-size="16" font-weight="700" fill="#ffffff">AI production crew</text>
  <text x="322" y="150" font-size="13" fill="#9fb3c8">Microsoft Agent Framework workflows · models on Microsoft Foundry</text>

  <g font-size="13">
    <rect x="322" y="170" width="150" height="74" rx="8" fill="#163552"/>
    <text x="336" y="196" font-weight="700" fill="#ffffff">Stats desk</text>
    <text x="336" y="216" fill="#cdd8e2">spots moments, explains</text>
    <text x="336" y="233" fill="#cdd8e2">why they matter (tools)</text>

    <rect x="500" y="170" width="150" height="74" rx="8" fill="#163552"/>
    <text x="514" y="196" font-weight="700" fill="#ffffff">Director</text>
    <text x="514" y="216" fill="#cdd8e2">per feed: speak, graphic,</text>
    <text x="514" y="233" fill="#cdd8e2">replay angle</text>

    <rect x="678" y="170" width="160" height="74" rx="8" fill="#163552"/>
    <text x="692" y="196" font-weight="700" fill="#ffffff">Commentators ×4</text>
    <text x="692" y="216" fill="#cdd8e2">one agent per feed, in</text>
    <text x="692" y="233" fill="#cdd8e2">its language and voice</text>

    <rect x="678" y="268" width="160" height="62" rx="8" fill="#163552"/>
    <text x="692" y="292" font-weight="700" fill="#ffffff">Voice</text>
    <text x="692" y="312" fill="#cdd8e2">Azure AI Speech</text>

    <rect x="322" y="268" width="150" height="62" rx="8" fill="#163552"/>
    <text x="336" y="292" font-weight="700" fill="#ffffff">Editor</text>
    <text x="336" y="312" fill="#cdd8e2">half/full-time packages</text>

    <rect x="500" y="268" width="150" height="62" rx="8" fill="#163552"/>
    <text x="514" y="292" font-weight="700" fill="#ffffff">Producer</text>
    <text x="514" y="312" fill="#cdd8e2">answers viewer questions</text>
  </g>
  <line x1="472" y1="207" x2="496" y2="207" stroke="#9fb3c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="207" x2="674" y2="207" stroke="#9fb3c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="758" y1="244" x2="758" y2="264" stroke="#9fb3c8" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12.5" fill="#cdd8e2">
    <text x="322" y="362">Works 15 s ahead of the picture, like a broadcast delay, so lines and replays land on the moment.</text>
    <text x="322" y="384">Shared booth state: what each feed has said and when it is free; handoffs are workflow messages.</text>
    <text x="322" y="406">If a model is slow or fails, the director uses its rules and commentators a prepared line.</text>
    <text x="322" y="428">Output is a rundown: timed, machine-readable cues for lines, graphics, replays and highlights.</text>
    <text x="322" y="450">Each feed is produced once per match and served to every viewer of it; questions are live.</text>
  </g>

  <!-- serving -->
  <rect x="900" y="96" width="300" height="130" rx="10" fill="#ffffff" stroke="#c6cdc3"/>
  <text x="918" y="126" font-size="16" font-weight="700" fill="#0b2236">Azure Container Apps</text>
  <text x="918" y="152" font-size="13" fill="#2b3d4c">FastAPI: match clock, stats, crew</text>
  <text x="918" y="172" font-size="13" fill="#2b3d4c">WebSocket: frames, events, cues</text>
  <text x="918" y="192" font-size="13" fill="#2b3d4c">Managed identity, no keys</text>
  <text x="918" y="212" font-size="12" fill="#51606c">speech-only browser tokens</text>

  <rect x="900" y="248" width="300" height="220" rx="10" fill="#ffffff" stroke="#c6cdc3"/>
  <text x="918" y="278" font-size="16" font-weight="700" fill="#0b2236">Viewer's browser</text>
  <text x="918" y="304" font-size="13" fill="#2b3d4c">React + Three.js 3D broadcast</text>
  <text x="918" y="324" font-size="13" fill="#2b3d4c">graphics, captions, voice, crowd</text>
  <text x="918" y="344" font-size="13" fill="#2b3d4c">any-angle replays from tracking</text>
  <text x="918" y="364" font-size="13" fill="#2b3d4c">Gallery: four feeds + talkback</text>
  <text x="918" y="384" font-size="13" fill="#2b3d4c">ask by voice (Azure AI Speech)</text>
  <g font-size="12" font-weight="600">
    <rect x="918" y="402" width="80" height="26" rx="5" fill="#1f4fd1"/><text x="930" y="420" fill="#fff">New fan</text>
    <rect x="1004" y="402" width="74" height="26" rx="5" fill="#0b2236"/><text x="1016" y="420" fill="#fff">Analyst</text>
    <rect x="1084" y="402" width="100" height="26" rx="5" fill="#c27a0e"/><text x="1094" y="420" fill="#fff">中文 · No.10</text>
    <rect x="918" y="434" width="130" height="26" rx="5" fill="#51606c"/><text x="930" y="452" fill="#fff">Audio described</text>
  </g>

  <!-- flows -->
  <line x1="260" y1="196" x2="296" y2="196" stroke="#51606c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="392" x2="296" y2="392" stroke="#51606c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="160" x2="896" y2="160" stroke="#51606c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="226" x2="1050" y2="244" stroke="#51606c" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="520" font-size="13" fill="#51606c">Five stages of the brief: ingest (live frames and events) · interpret (stats) · explain (stats desk, commentators) ·</text>
  <text x="40" y="540" font-size="13" fill="#51606c">present (timed cues rendered as overlays) · personalise (four feeds, languages, a followed player, audio description, questions).</text>
  <text x="40" y="580" font-size="12" fill="#8a96a1">All data is synthetic. No real clubs, players, competitions or broadcasters.</text>
</svg>
